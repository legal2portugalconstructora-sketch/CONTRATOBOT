# config.example.yaml — PLANTILLA de config.yaml, sin credenciales reales.
# Este archivo SÍ se puede subir a un repositorio (a diferencia de
# config.yaml, que está en .gitignore). Sirve para que cualquiera que
# clone el proyecto sepa qué estructura tiene que tener su propio
# config.yaml.
#
# Para crear tu config.yaml real:
#   1. Copiá este archivo a config.yaml.
#   2. Reemplazá los usuarios de ejemplo por los reales.
#   3. Generá el hash de cada contraseña (ver README.md, sección
#      "Configurar usuarios") -- NUNCA escribas una contraseña en texto
#      plano en config.yaml.
#   4. Generá una "cookie.key" nueva y aleatoria (también en el README).

credentials:
  usernames:
    admin:
      name: Nombre Apellido
      email: usuario@empresa.com
      password: $2b$12$REEMPLAZAR_CON_HASH_BCRYPT_REAL

cookie:
  name: contratobot_auth_cookie
  key: REEMPLAZAR_CON_UNA_CLAVE_ALEATORIA_LARGA
  expiry_days: 7

# URL del webhook de n8n que recibe un aviso cada vez que se genera un
# CONTRATO en el módulo Word (ver n8n_integracion.py). Si esta clave no
# existe o está vacía, la app simplemente no envía nada a n8n -- no hace
# falta tenerla configurada para que el resto de la app funcione.
n8n_webhook_url: http://localhost:5678/webhook/registrar-contrato

# Clave opcional que se manda en el header "X-Api-Key" de cada POST a
# n8n_webhook_url, para que n8n solo acepte avisos de las PCs que la
# conocen (útil cuando varias PCs le escriben al mismo n8n en la nube).
# Si esta clave no existe o está vacía, no se manda ningún header
# X-Api-Key -- igual que hoy.
n8n_webhook_api_key: REEMPLAZAR_CON_LA_CLAVE_REAL

# Código corto de cada proyecto, usado para armar el ID_CONTRATO
# (CODIGO-AAAA-NNNN, ej. "CDV-2026-0001") que se le asigna a cada
# CONTRATO la primera vez que se genera (ver n8n_integracion.py,
# _obtener_o_asignar_id_contrato). Si un proyecto no aparece acá, no se
# le asigna ningún ID inventado -- se avisa en pantalla que falta
# agregarlo.
codigos_proyecto:
  COSTA DEL VALLE: CDV
  COSTA DEL LAGO: CDL
  COSTA AZUL: CAZ
  COSTA DEL SOL: CDS
  FINCA DEL VALLE: FDV
  HACIENDA CHIRIBAYA: HCH
  RIVIERA COAST: RVC

# Rango opcional de números para el NNNN de ID_CONTRATO en ESTA PC.
# Sirve para que dos PCs que le escriben al mismo n8n en la nube nunca
# puedan asignar el mismo ID_CONTRATO, aunque sea para el mismo
# proyecto y año: a cada PC se le da un rango distinto (ej. PC1
# 1-4999, PC2 5000-9999). Si no se configuran, el rango es 1-9999 (sin
# dividir entre PCs, igual que hoy). Si se llega al máximo del rango,
# la app avisa con un error claro en vez de asignar un número repetido.
# Ambos valores deben ser números enteros entre 1 y 9999, con inicio
# menor o igual a fin -- si están pero no cumplen esto, la app NO
# asigna ningún ID_CONTRATO hasta que se corrija (no usa un valor por
# defecto en ese caso, para evitar un rango equivocado sin darse cuenta).
id_contrato_rango_inicio: 1
id_contrato_rango_fin: 9999
